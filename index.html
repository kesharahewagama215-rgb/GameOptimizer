<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game Optimizer</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #10131a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app {
            width: 100%;
            max-width: 420px;
            background: #191d27;
            border-radius: 20px;
            padding: 25px;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #9da3b0;
            margin-bottom: 25px;
        }

        .card {
            background: #222734;
            padding: 18px;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            margin: 12px 0;
        }

        .value {
            font-weight: bold;
        }

        button {
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 12px;
            background: #4f7cff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #result {
            text-align: center;
            margin-top: 15px;
            color: #70e000;
        }
    </style>
</head>

<body>

    <div class="app">

        <h1>Game Optimizer</h1>

        <p class="subtitle">
            Simple Performance Helper
        </p>

        <div class="card">

            <div class="row">
                <span>Device Status</span>
                <span class="value">Good</span>
            </div>

            <div class="row">
                <span>RAM</span>
                <span class="value">4.2 GB</span>
            </div>

            <div class="row">
                <span>Storage</span>
                <span class="value">18 GB Free</span>
            </div>

        </div>

        <button onclick="optimize()">
            OPTIMIZE
        </button>

        <p id="result"></p>

    </div>

    <script>
        function optimize() {
            document.getElementById("result").innerText =
                "Optimization check completed!";
        }
    </script>

</body>
</html>
